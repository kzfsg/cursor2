<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test - Dictionary</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }
        
        .layout {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .layout.hidden {
            display: none !important;
        }
        
        #chat-layout {
            flex-direction: row;
            align-items: stretch;
            justify-content: flex-start;
        }
        
        .sidebar {
            width: 280px;
            height: 100vh;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 0 16px 16px 0;
            padding: 1rem;
            color: white;
        }
        
        .chat-container {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            margin-left: 280px;
            width: calc(100vw - 280px);
            display: flex;
            flex-direction: column;
        }
        
        .chat-input-container {
            padding: 1rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            margin: 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: white;
            font-size: 1rem;
            padding: 0.5rem;
        }
        
        input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }
        
        button {
            background: #ff6b35;
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            color: white;
            cursor: pointer;
        }
        
        h1 {
            color: white;
            font-size: 3rem;
            margin-bottom: 2rem;
        }
        
        .glass-input {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <!-- Initial layout -->
    <div id="initial-layout" class="layout">
        <h1>dictionary</h1>
        <div class="glass-input">
            <input type="text" id="text-input" placeholder="How can I help you today?" />
        </div>
        <p style="color: rgba(255,255,255,0.8); margin-top: 1rem;">ask anything.</p>
    </div>

    <!-- Chat layout -->
    <div id="chat-layout" class="layout hidden">
        <div class="sidebar">
            <h3>Sidebar</h3>
            <p>This is the sidebar content</p>
        </div>
        <div class="chat-container">
            <div style="flex: 1; padding: 2rem;">
                <h2 style="color: white;">Chat Area</h2>
                <p style="color: rgba(255,255,255,0.8);">Messages will appear here</p>
            </div>
            <div class="chat-input-container">
                <input type="text" id="chat-input" placeholder="Reply to Dictionary..." />
                <button onclick="sendMessage()">●</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const textInput = document.getElementById('text-input');
            const chatInput = document.getElementById('chat-input');
            
            textInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    switchToChat();
                }
            });
            
            chatInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    sendMessage();
                }
            });
        });
        
        function switchToChat() {
            document.getElementById('initial-layout').classList.add('hidden');
            document.getElementById('chat-layout').classList.remove('hidden');
        }
        
        function sendMessage() {
            const input = document.getElementById('chat-input');
            const message = input.value.trim();
            if (message) {
                console.log('Message:', message);
                input.value = '';
            }
        }
    </script>
</body>
</html>
